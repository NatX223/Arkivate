# Builds the worker image remotely (no local Docker). The Dockerfile lives in backend/worker,
# so the build context is the repo root. Usage:
#   gcloud builds submit --config cloudbuild.yaml --substitutions _IMAGE=REGION-docker.pkg.dev/PROJECT_ID/arkivate/worker:latest .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "backend/worker/Dockerfile", "-t", "$_IMAGE", "."]
images: ["$_IMAGE"]
substitutions:
  _IMAGE: REGION-docker.pkg.dev/PROJECT_ID/arkivate/worker:latest
